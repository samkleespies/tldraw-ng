[package]
name = "core"
version = "0.1.0"
edition = "2021"
description = "High-performance whiteboard core built with Rust + WebGPU"
repository = "https://github.com/your-username/tldraw-ng"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WebGPU rendering
wgpu = { version = "25.0", features = ["webgl"] }
lyon = { version = "1.0" }
bytemuck = { version = "1.16", features = ["derive"] }

# WASM bindings
wasm-bindgen = { version = "0.2.95", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
base64 = "0.22"

# Math utilities
glam = { version = "0.25", features = ["serde"] }

# Logging
log = "0.4"
web-sys = { version = "0.3", features = [
  "console",
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "ImageData",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "GpuCanvasContext",
  "GpuDevice",
  "GpuQueue",
  "GpuCommandEncoder",
  "GpuRenderPassEncoder",
  "GpuBuffer",
  "GpuTexture",
  "GpuTextureView",
  "GpuRenderPipeline",
  "GpuBindGroup",
  "GpuBindGroupLayout",
  "GpuPipelineLayout",
  "GpuShaderModule",
  "Navigator",
  "Gpu",
] }

[features]
default = ["console_error_panic_hook"]
